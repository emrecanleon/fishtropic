          if (audioCtx.state === "suspended") audioCtx.resume();
          var t0 = audioCtx.currentTime + when;
          var osc = audioCtx.createOscillator();
          var g = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, t0);
          g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
          osc.connect(g);
          g.connect(masterGain);
          osc.start(t0);
          osc.stop(t0 + dur + 0.05);
        }

        // Yakalama: neşeli 3 nota (C5-E5-G5, triangle)
        function playCatchSound() {
          playTone(523.25, 0, 0.18, "triangle", 0.22);
          playTone(659.25, 0.12, 0.18, "triangle", 0.22);
          playTone(783.99, 0.24, 0.3, "triangle", 0.22);
        }

        // Kaçırma: buzz (220Hz + 165Hz sawtooth)
        function playEscapeSound() {
          playTone(220, 0, 0.35, "sawtooth", 0.09);
          playTone(165, 0, 0.35, "sawtooth", 0.09);
        }

        // Tebrik: zafer melodisi (C-E-G-C) + son akor
        function playVictorySound() {
          var notes = [523.25, 659.25, 783.99, 1046.5];
          for (var i = 0; i < notes.length; i++) {
            playTone(notes[i], i * 0.18, 0.25, "triangle", 0.22);
          }
          var chord = [523.25, 659.25, 783.99, 1046.5];
          for (var j = 0; j < chord.length; j++) {
            playTone(chord[j], 0.8, 1.0, "triangle", 0.14);
          }
        }

        // Sıçrama: kısa beyaz gürültü + bandpass
        function playSplashSound() {
          if (!audioCtx || !soundOn) return;
          var t0 = audioCtx.currentTime;
          var src = audioCtx.createBufferSource();
          src.buffer = makeNoiseBuffer(0.3);
          var bp = audioCtx.createBiquadFilter();
          bp.type = "bandpass";
          bp.frequency.value = 1200;
          bp.Q.value = 0.8;
          var g = audioCtx.createGain();
          g.gain.setValueAtTime(0.25, t0);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
          src.connect(bp);
          bp.connect(g);
          g.connect(masterGain);
          src.start(t0);
        }

        // Buton tıklama: kısa square ton
        function playClickSound() {
          playTone(660, 0, 0.06, "square", 0.06);
        }

        // Ses aç/kapa
        function updateSoundButton() {
          var ico = document.getElementById("soundIcon");
          var txt = document.getElementById("soundText");
          if (ico) ico.textContent = soundOn ? "🔊" : "🔇";
          if (txt) txt.textContent = soundOn ? t("soundOff") : t("soundOn");
          var btn = document.getElementById("soundBtn");
          if (btn) btn.title = soundOn ? t("soundOff") : t("soundOn");
        }

        function toggleSound() {
          soundOn = !soundOn;
          storageSet(STORAGE_SOUND, soundOn ? "1" : "0");
          if (ensureAudio()) {
            masterGain.gain.setTargetAtTime(
              soundOn ? 1 : 0,
              audioCtx.currentTime,
              0.05,
            );
            startSeaSound();
          }
          updateSoundButton();
          playClickSound();
        }

        // İlk kullanıcı etkileşiminde sesi başlat (tarayıcı politikası)
        function startAudioOnFirstInteraction() {
          updateSoundButton();

          function onFirst() {
            window.removeEventListener("pointerdown", onFirst, true);
            window.removeEventListener("touchstart", onFirst, true);
            window.removeEventListener("mousedown", onFirst, true);
            window.removeEventListener("click", onFirst, true);
            window.removeEventListener("keydown", onFirst, true);

            if (!audioCtx) {
              ensureAudio();
            }
            if (!audioCtx) return;

            var doResume =
              audioCtx.state === "suspended"
                ? audioCtx.resume()
                : Promise.resolve();

            doResume
              .then(function () {
                try {
                  var osc = audioCtx.createOscillator();
                  var g = audioCtx.createGain();
                  g.gain.value = 0.0001;
                  osc.connect(g);
                  g.connect(audioCtx.destination);
                  osc.start();
                  osc.stop(audioCtx.currentTime + 0.01);
                } catch (e) {
                  /* sessiz geç */
                }

                startSeaSound();
              })
              .catch(function () {
                startAudioOnFirstInteraction();
              });
          }

          window.addEventListener("pointerdown", onFirst, true);
          window.addEventListener("touchstart", onFirst, true);
          window.addEventListener("mousedown", onFirst, true);
          window.addEventListener("click", onFirst, true);
          window.addEventListener("keydown", onFirst, true);
        }

        // =====================================================
        // SIÇRAMA EFEKTLERİ
        // =====================================================
        function createSplash(x, y) {
          var i;
          // 12 partikül
          for (i = 0; i < 12; i++) {
            var ang = -Math.PI * (0.15 + Math.random() * 0.7);
            var sp = 2 + Math.random() * 3.5;
            particles.push({
              x: x,
              y: y,
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp,
              r: 2 + Math.random() * 2.5,
              life: 1,
              color: i % 2 === 0 ? "#ffffff" : "#bfe9ff",
            });
          }
          // 3 halka
          for (i = 0; i < 3; i++) {
            ripples.push({
              x: x,
              y: y,
              r: 2,
              maxR: 30 + i * 14,
              delay: i * 6,
              a: 0.8,
            });
          }
        }

        function updateEffects() {
          var i;
          for (i = particles.length - 1; i >= 0; i--) {
            var p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2;
            p.life -= 0.025;
            if (p.life <= 0) particles.splice(i, 1);
          }
          for (i = ripples.length - 1; i >= 0; i--) {
            var rp = ripples[i];
            if (rp.delay > 0) {
              rp.delay--;
              continue;
            }
            rp.r += 1.2;
            rp.a = 0.8 * (1 - rp.r / rp.maxR);
            if (rp.r >= rp.maxR) ripples.splice(i, 1);
          }
        }

        function drawEffects() {
          var i;
          ctx.lineWidth = 1.6;
          for (i = 0; i < ripples.length; i++) {
            var rp = ripples[i];
            if (rp.delay > 0) continue;
            ctx.strokeStyle =
              "rgba(255,255,255," + Math.max(0, rp.a).toFixed(2) + ")";
            ctx.beginPath();
            ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.35, 0, 0, TWO_PI);
            ctx.stroke();
          }
          for (i = 0; i < particles.length; i++) {
            var p = particles[i];
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, TWO_PI);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        // =====================================================
        // BALIK SEÇİMİ
        // =====================================================
        function isCaught(id) {
          return caughtIds.indexOf(id) !== -1;
        }

        // İlk balık her zaman Palyaço; sonra ağırlıklı rastgele (kolay 5, zor 2).
        // En zor seviye sadece diğerleri bittiyse. Yoksa -1 döner.
        function pickNextFish() {
          if (caughtIds.length === 0) return 0; // forcedFirst

          var pool = [],
            total = 0,
            i,
            f,
            w;
          for (i = 0; i < FISH_DATA.length; i++) {
            f = FISH_DATA[i];
            if (isCaught(f.id) || f.level === 3) continue;
            w = LEVEL_CONFIG[f.level].weight;
            pool.push({ id: f.id, w: w });
            total += w;
          }
          if (pool.length === 0) {
            for (i = 0; i < FISH_DATA.length; i++) {
              if (!isCaught(FISH_DATA[i].id) && FISH_DATA[i].level === 3) {
                pool.push({ id: FISH_DATA[i].id, w: 1 });
                total += 1;
              }
            }
          }
          if (pool.length === 0) return -1;

          var r = Math.random() * total;
          for (i = 0; i < pool.length; i++) {
            r -= pool[i].w;
            if (r <= 0) return pool[i].id;
          }
          return pool[pool.length - 1].id;
        }

        // =====================================================
        // OLTA ATMA / MARKER / YAKALAMA
        // =====================================================
        function getRodX() {
          return W * 0.5;
        }
        function getRodY() {
          return horizonY - 5;
        }

        // Denize tıklanınca olta at (tx: hedef x)
        function startCast(tx) {
          if (gameState !== "idle" || freeMode || winPending) return;
          var id = pickNextFish();
          if (id < 0) return;
          currentFish = id;

          var sx = getRodX();
          var sy = horizonY + 20; // bobber başlangıcı
          var targetX = Math.max(40, Math.min(W - 40, tx));
          var targetY = markerY - 60; // marker'ın 60px üstü
          var n = CAST_FRAMES;

          bobber.x = sx;
          bobber.y = sy;
          bobber.vx = (targetX - sx) / n;
          bobber.vy = (targetY - sy - (GRAVITY * n * (n - 1)) / 2) / n; // kavisli uçuş
          bobber.tx = targetX;
          bobber.ty = targetY;
          castT = 0;
          gameState = "casting";
          playClickSound();
        }

        function updateCast() {
          bobber.x += bobber.vx;
          bobber.y += bobber.vy;
          bobber.vy += GRAVITY;
          castT++;
          if (castT >= CAST_FRAMES) {
            bobber.x = bobber.tx;
            bobber.y = bobber.ty;
            createSplash(bobber.x, bobber.y);
            playSplashSound();
            startMarker();
          }
        }

        // Hedefe varınca marker çubuğunu başlat
        function startMarker() {
          var cfg = LEVEL_CONFIG[FISH_DATA[currentFish].level];
          barW = Math.min(MARKER_BAR_MAX_WIDTH, W - 50);
          zoneW = barW * cfg.zone;
          zoneX = Math.random() * (barW - zoneW);
          markerSpeed = cfg.speed * (barW / MARKER_BAR_MAX_WIDTH);
          markerPos = 0;
          markerDir = 1;
          gameState = "marker";
        }

        function updateMarker() {
          markerPos += markerDir * markerSpeed;
          if (markerPos >= barW) {
            markerPos = barW;
            markerDir = -1;
          }
          if (markerPos <= 0) {
            markerPos = 0;
            markerDir = 1;
          }
        }

        // Tıklama / Space / Enter ile sonuçlandır
        function resolveCatch() {
          if (gameState !== "marker") return;
          var hit = markerPos >= zoneX && markerPos <= zoneX + zoneW;

          reelFromX = bobber.x;
          reelFromY = bobber.y;
          reelT = 0;
          gameState = "reel";

          if (hit) {
            var id = currentFish;
            caughtIds.push(id);
            saveCollection();
            updateCounter();
            createSplash(bobber.x, bobber.y);
            playSplashSound();
            playCatchSound();
            showMsg(fmt(t("caughtMsg"), { name: fishName(id) }));
            spawnSwimmer(id, bobber.x, bobber.y, Math.random() < 0.5 ? 1 : -1);
            if (caughtIds.length >= TOTAL_FISH) winTimer = WIN_DELAY;
          } else {
            playEscapeSound();
            showMsg(t("escapedMsg"));
          }
        }

        // Ana eylem: pointerdown (px, py) veya klavye (px = null)
        function handlePrimaryAction(px, py) {
          // Tebrik ekranı açıkken: serbest moda geç
          if (winPending) {
            startFreeMode();
            return;
          }
          if (freeMode) return;

          if (gameState === "marker") {
            resolveCatch();
            return;
          }

          if (gameState === "idle") {
            if (px === null) {
              // Klavye: rastgele bir noktaya at
              startCast(W * (0.2 + Math.random() * 0.6));
            } else if (py > horizonY && py < seabedY) {
              startCast(px); // sadece denize tıklama geçerli
            }
          }
        }

        function startFreeMode() {
          freeMode = true;
          winPending = false;
          hideWin();
          showMsg(t("freeMsg"));
        }

        function showVictory() {
          winPending = true;
          playVictorySound();
          showWin();
        }

        // Oyunu sıfırla (Yeniden başlat butonu)
        function resetGame() {
          swimmers = [];
          particles = [];
          ripples = [];
          caughtIds = [];
          saveCollection();
          gameState = "idle";
          currentFish = -1;
          freeMode = false;
          winPending = false;
          winTimer = 0;
          hideWin();
          updateCounter();
          playClickSound();
        }

        // =====================================================
        // BALIK DAVRANIŞI (yakalandıktan sonra denizde yüzme)
        // =====================================================
        function fishBaseScale() {
          return Math.max(0.5, Math.min(1.3, seaH / 420));
        }
        function fishScale(id) {
          return fishBaseScale() * FISH_DATA[id].size;
        }

        // Boyuta göre derinlik sınırları (büyük balıklar su üstüne çıkmaz)
        function getDepthLimits(id) {
          var bodyHeight = getFishBodyHeight(id, fishScale(id));
          // Dalgaların en alt çizgisi horizonY + 24 civarında; onun altından başlat
          var waveBottom = horizonY + 28;
          var topLimit = waveBottom + bodyHeight * 0.6 + 10;
          return {
            top: topLimit,
            bottom: seabedY - bodyHeight * 0.6 - 5,
          };
        }

        function clampY(id, y) {
          var lim = getDepthLimits(id);
          if (lim.bottom < lim.top) return (lim.top + lim.bottom) / 2;
          return Math.max(lim.top, Math.min(lim.bottom, y));
        }

        // Yeni yüzücü ekle (dir: +1 sağa, -1 sola)
        function spawnSwimmer(id, x, y, dir) {
          var speedScale = Math.max(0.7, Math.min(1.5, W / 800));
          swimmers.push({
            id: id,
            x: x,
            baseY: clampY(id, y),
            y: clampY(id, y),
            dir: dir,
            speed:
              ((0.7 + Math.random() * 0.7) * speedScale) /
              Math.sqrt(FISH_DATA[id].size),
            phase: Math.random() * TWO_PI,
            state: "swim", // 'swim' | 'wait'
            reentryDelay: 0,
          });
        }

        // Sayfa açılışında koleksiyondaki balıkları denize bırak (resize'dan sonra çağrılır)
        function restoreSwimmers() {
          swimmers = [];
          for (var i = 0; i < caughtIds.length; i++) {
            var id = caughtIds[i];
            var lim = getDepthLimits(id);
            spawnSwimmer(
              id,
              Math.random() * W,
              lim.top + Math.random() * Math.max(0, lim.bottom - lim.top),
              Math.random() < 0.5 ? 1 : -1,
            );
          }
          if (caughtIds.length >= TOTAL_FISH) freeMode = true;
        }

        function updateSwimmers() {
          for (var i = 0; i < swimmers.length; i++) {
            var s = swimmers[i];
            var half = FISH_SHAPE[s.id].L * fishScale(s.id);
            var margin = half * 1.6 + 20;

            // Kenarda bekleme: 30-60 kare sonra AYNI TARAFTA, TERS yönde belirir
            if (s.state === "wait") {
              s.reentryDelay--;
              if (s.reentryDelay <= 0) {
                s.state = "swim";
                s.phase = Math.random() * TWO_PI; // phase yenilenir
                var lim = getDepthLimits(s.id);
                s.baseY =
                  lim.top + Math.random() * Math.max(0, lim.bottom - lim.top);
                s.x = s.dir < 0 ? W + margin : -margin; // dir zaten ters çevrildi
              }
              continue;
            }

            s.x += s.dir * s.speed;

            // Hafif yukarı-aşağı süzülme (verticalSway) + sınır koruma
            var lim2 = getDepthLimits(s.id);
            var amp = Math.max(0, Math.min(12, (lim2.bottom - lim2.top) / 4));
            s.y = clampY(
              s.id,
              s.baseY + Math.sin(frameCount * 0.02 + s.phase) * amp,
            );

            // Kenara ulaşınca kaybol
            if (
              (s.dir > 0 && s.x > W + margin) ||
              (s.dir < 0 && s.x < -margin)
            ) {
              s.state = "wait";
              s.reentryDelay = 30 + Math.floor(Math.random() * 31);
              s.dir = -s.dir; // sağdan çıkan sağdan girer ama sola döner
            }
          }
        }

        function drawSwimmers() {
          for (var i = 0; i < swimmers.length; i++) {
            var s = swimmers[i];
            if (s.state !== "swim") continue;
            var angleSway = Math.sin(frameCount * 0.015 + s.phase) * 0.06; // hafif yatay eğim
            var wag = tailWagAngle(nowMs, s.phase);
            // flipX: sola bakarken aynala (ters dönme yok)
            drawFish(
              ctx,
              s.id,
              s.x,
              s.y,
              fishScale(s.id),
              s.dir < 0,
              angleSway * s.dir,
              wag,
            );
          }
        }

        // =====================================================
        // OLTA, BOBBER VE MARKER ÇİZİMİ
        // =====================================================
        function drawRodAndBobber() {
          if (gameState === "idle") return;

          var bx = bobber.x,
            by = bobber.y;
          if (gameState === "marker") by += Math.sin(frameCount * 0.12) * 2; // hafif sallanma
          if (gameState === "reel") {
            var k = Math.min(1, reelT);
            bx = lerp(reelFromX, getRodX(), k);
            by = lerp(reelFromY, getRodY(), k);
          }

          var rx = getRodX(),
            ry = getRodY();

          // Olta ipi (hafif sarkık eğri)
          ctx.strokeStyle = "rgba(255,255,255,0.85)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(rx, ry);
          ctx.quadraticCurveTo((rx + bx) / 2, Math.max(ry, by) - 6, bx, by - 6);
          ctx.stroke();

          // Olta ucu
          ctx.fillStyle = "#5a3a1a";
          ctx.beginPath();
          ctx.arc(rx, ry, 3, 0, TWO_PI);
          ctx.fill();

          // Bobber: üst kırmızı, alt beyaz
          ctx.beginPath();
          ctx.arc(bx, by, 7, Math.PI, TWO_PI);
          ctx.closePath();
          ctx.fillStyle = "#e53935";
          ctx.fill();
          ctx.beginPath();
          ctx.arc(bx, by, 7, 0, Math.PI);
          ctx.closePath();
          ctx.fillStyle = "#ffffff";
          ctx.fill();
          ctx.strokeStyle = "rgba(0,0,0,0.5)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(bx, by, 7, 0, TWO_PI);
          ctx.stroke();
        }

        // Yuvarlak köşeli dikdörtgen yolu (eski tarayıcılar için kendi yardımcımız)
        function roundRectPath(c, x, y, w, h, r) {
          c.beginPath();
          c.moveTo(x + r, y);
          c.lineTo(x + w - r, y);
          c.quadraticCurveTo(x + w, y, x + w, y + r);
          c.lineTo(x + w, y + h - r);
          c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          c.lineTo(x + r, y + h);
          c.quadraticCurveTo(x, y + h, x, y + h - r);
          c.lineTo(x, y + r);
          c.quadraticCurveTo(x, y, x + r, y);
          c.closePath();
        }

        function drawOutlinedText(text, x, y, maxW) {
          ctx.lineWidth = 3;
          ctx.strokeStyle = "rgba(0,0,0,0.8)";
          ctx.strokeText(text, x, y, maxW);
          ctx.fillStyle = "#fff";
          ctx.fillText(text, x, y, maxW);
        }

        function drawMarkerBar() {
          if (gameState !== "marker") return;

          var stripH = 26,
            pad = 8;
          var x0 = W / 2 - barW / 2;
          var yTop = markerY - stripH / 2;

          // Siyah yarı saydam kutu
          roundRectPath(
            ctx,
            x0 - pad,
            yTop - pad,
            barW + pad * 2,
            stripH + pad * 2,
            10,
          );
          ctx.fillStyle = "rgba(0,0,0,0.65)";
          ctx.fill();

          // Beyaz şerit
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x0, yTop, barW, stripH);

          // Yeşil hedef bölge
          ctx.fillStyle = "#2ecc40";
          ctx.fillRect(x0 + zoneX, yTop, zoneW, stripH);

          // Kırmızı marker çizgisi (6px, üstten ve alttan 6px taşar)
          ctx.fillStyle = "#e53935";
          ctx.fillRect(x0 + markerPos - 3, yTop - 6, 6, stripH + 12);

          // Üst ve alt yazılar
          ctx.save();
          ctx.direction = currentLang === "ar" ? "rtl" : "ltr";
          ctx.textAlign = "center";
          ctx.font =
            'bold 15px system-ui, -apple-system, "Segoe UI", Arial, sans-serif';

          ctx.textBaseline = "bottom";
          drawOutlinedText(t("tapGreen"), W / 2, yTop - pad - 8, W - 20);

          ctx.textBaseline = "top";
          var label =
            t("targetLabel") +
            ": " +
            fishName(currentFish) +
            " " +
            fishStars(currentFish);
          drawOutlinedText(label, W / 2, yTop + stripH + pad + 8, W - 20);
          ctx.restore();
        }

        // =====================================================
        // OYUN GÜNCELLEME VE ÇİZİM (loop her karede çağırır)
        // =====================================================
        function updateGame() {
          if (gameState === "casting") updateCast();
          else if (gameState === "marker") updateMarker();
          else if (gameState === "reel") {
            reelT += 1 / REEL_FRAMES;
            if (reelT >= 1) gameState = "idle";
          }

          updateSwimmers();
          updateEffects();

          if (winTimer > 0) {
            winTimer--;
            if (winTimer === 0) showVictory();
          }
        }

        function drawGame() {
          drawSwimmers();
          drawRodAndBobber();
          drawEffects();
          drawMarkerBar();
        }
        // =====================================================
        // BÖLÜM 6: KOLEKSİYON, PANELLER, DİL, OLAYLAR, LOOP, BAŞLATMA
        // =====================================================

        // ----- DOM referansları -----
        var elMsg = document.getElementById("msg");
        var elCountNum = document.getElementById("countNum");
        var elRestart = document.getElementById("restartBtn");
        var elRestartTxt = document.getElementById("restartText");
        var elSound = document.getElementById("soundBtn");
        var elLangBtn = document.getElementById("langBtn");
        var elLangMenu = document.getElementById("langMenu");
        var elCollBtn = document.getElementById("collBtn");
        var elCollBtnTxt = document.getElementById("collBtnText");
        var elAboutBtn = document.getElementById("aboutBtn");
        var elAboutBtnTxt = document.getElementById("aboutBtnText");
        var elCollPanel = document.getElementById("collPanel");
        var elCollTitle = document.getElementById("collTitle");
        var elCollGrid = document.getElementById("collGrid");
        var elProgBar = document.getElementById("progBar");
        var elProgText = document.getElementById("progText");
        var elCollClose = document.getElementById("collClose");
        var elAboutPanel = document.getElementById("aboutPanel");
        var elAboutTitle = document.getElementById("aboutTitle");
        var elAboutBody = document.getElementById("aboutContent");
        var elAboutClose = document.getElementById("aboutClose");
        var elWin = document.getElementById("win");
        var elWinTitle = document.getElementById("winTitle");
        var elWinText = document.getElementById("winText");
        var elDevLine = document.querySelector(".dev-line");
        var elCopyLine = document.querySelector(".copy-line");

        // ----- Koleksiyon kaydı (localStorage: fishtropic_collection) -----
        function loadCollection() {
          caughtIds = [];
          var raw = storageGet(STORAGE_COLL);
          if (!raw) return;
          try {
            var arr = JSON.parse(raw);
            if (!Array.isArray(arr)) return;
            for (var i = 0; i < arr.length; i++) {
              var id = arr[i];
              if (
                typeof id === "number" &&
                id >= 0 &&
                id < TOTAL_FISH &&
                caughtIds.indexOf(id) === -1
              ) {
                caughtIds.push(id);
              }
            }
          } catch (e) {
            caughtIds = [];
          }
        }

        function saveCollection() {
          storageSet(STORAGE_COLL, JSON.stringify(caughtIds));
        }

        // Sayaç: kalan balık sayısı
        function updateCounter() {
          elCountNum.textContent = String(TOTAL_FISH - caughtIds.length);
        }

        // ----- Yeniden başlat onayı (ilk dokunuş uyarır, ikinci dokunuş siler) -----
        var RESTART_CONFIRM = {
          tr: "Emin misin?",
          us: "Are you sure?",
          es: "¿Seguro?",
          fr: "Sûr ?",
          de: "Sicher?",
          it: "Sicuro?",
          br: "Tem certeza?",
          ar: "هل أنت متأكد؟",
          ru: "Уверен?",
          cn: "确定吗？",
        };
        var restartArmed = false,
          restartTimer = 0;

        function disarmRestart() {
          restartArmed = false;
          clearTimeout(restartTimer);
          elRestart.classList.remove("armed");
          elRestartTxt.textContent = t("restart");
        }

        function onRestartClick() {
          if (!restartArmed && caughtIds.length > 0) {
            restartArmed = true;
            elRestart.classList.add("armed");
            elRestartTxt.textContent =
              RESTART_CONFIRM[currentLang] || RESTART_CONFIRM.tr;
            restartTimer = setTimeout(disarmRestart, 3000);
            return;
          }
          disarmRestart();
          resetGame();
        }

        // ----- Mesaj balonu -----
        var msgTimer = 0;
        function showMsg(text) {
          elMsg.textContent = text;
          elMsg.classList.add("show");
          clearTimeout(msgTimer);
          msgTimer = setTimeout(function () {
            elMsg.classList.remove("show");
          }, 2200);
        }

        // ----- Tebrik paneli -----
        function showWin() {
          elWin.classList.add("open");
        }
        function hideWin() {
          elWin.classList.remove("open");
        }

        // ----- Panel yönetimi -----
        function anyPanelOpen() {
          return (
            elCollPanel.classList.contains("open") ||
            elAboutPanel.classList.contains("open")
          );
        }

        function closeLangMenu() {
          elLangMenu.classList.remove("open");
          document.getElementById("hudRight").style.zIndex = "";
        }

        function closePanels() {
          elCollPanel.classList.remove("open");
          elAboutPanel.classList.remove("open");
          closeLangMenu();
          // Dil menüsü kapandığında HUD z-index'ini normale döndür
          document.getElementById("hudRight").style.zIndex = "";
        }

        // ----- Koleksiyon paneli -----
        function buildCollection() {
          elCollGrid.innerHTML = "";
          var cardDpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);

          for (var id = 0; id < TOTAL_FISH; id++) {
            var caught = isCaught(id);
            var card = document.createElement("div");
            card.className = "coll-card" + (caught ? "" : " locked");

            var cv = document.createElement("canvas");
            card.appendChild(cv);

            var badge = document.createElement("div");
            badge.className = "badge";
            badge.textContent = caught ? "✓" : "🔒";
            card.appendChild(badge);

            var label = document.createElement("div");
            label.textContent = fishName(id);
            card.appendChild(label);

            var stars = document.createElement("div");
            stars.textContent = fishStars(id);
            card.appendChild(stars);

            elCollGrid.appendChild(card);

            // Panel görünürken ölçü alınır (panel önce açılmış olmalı)
            // requestAnimationFrame ile bir sonraki frame'de ölç, böylece layout hazır olur
            (function (canvasEl, fishId) {
              requestAnimationFrame(function () {
                var cw = canvasEl.clientWidth || 90;
                var ch = canvasEl.clientHeight || 54;
                canvasEl.width = Math.round(cw * cardDpr);
                canvasEl.height = Math.round(ch * cardDpr);
                var g = canvasEl.getContext("2d");
                g.setTransform(cardDpr, 0, 0, cardDpr, 0, 0);
                drawFishIcon(g, fishId, cw, ch);
              });
            })(cv, id);
          }

          var count = caughtIds.length;
          elProgBar.style.width = (count / TOTAL_FISH) * 100 + "%";
          elProgText.textContent = fmt(t("progress"), { n: count });
        }

        function openCollection() {
          closePanels();
          elCollPanel.classList.add("open");
          buildCollection();
        }

        // ----- Oyun Hakkında paneli -----
        function buildAbout() {
          var html = "<h3>" + t("howTitle") + "</h3><ul>";
          var how = t("how");
          for (var i = 0; i < how.length; i++)
            html += "<li>" + how[i] + "</li>";
          html += "</ul><h3>" + t("typesTitle") + "</h3>";

          var groups = [
            { level: 1, title: t("easy") },
            { level: 2, title: t("hard") },
            { level: 3, title: t("hardest") },
          ];
          for (var g = 0; g < groups.length; g++) {
            var names = [];
            for (var f = 0; f < FISH_DATA.length; f++) {
              if (FISH_DATA[f].level === groups[g].level)
                names.push(fishName(FISH_DATA[f].id));
            }
            html +=
              "<p><strong>" +
              groups[g].title +
              ":</strong> " +
              names.join(", ") +
              "</p>";
          }

          html += "<h3>" + t("goalTitle") + "</h3><p>" + t("goal") + "</p>";
          elAboutBody.innerHTML = html;

          // Geliştirici ismi hiçbir dilde çevrilmez (Latin alfabesiyle kalır)
          elDevLine.textContent = t("dev") + ": A.EMRE CANASLAN";
          elCopyLine.textContent = t("rights");
        }

        function openAbout() {
          closePanels();
          buildAbout();
          elAboutPanel.classList.add("open");
        }

        // ----- Dil sistemi -----
        function buildLangMenu() {
          elLangMenu.innerHTML = "";
          for (var i = 0; i < LANG_LIST.length; i++) {
            (function (info) {
              var item = document.createElement("div");
              item.className =
                "lang-item" + (info.code === currentLang ? " active" : "");
              item.innerHTML =
                FLAGS[info.code] + "<span>" + info.name + "</span>";
              item.addEventListener("click", function (e) {
                e.stopPropagation();
                setLang(info.code);
                closeLangMenu();
                playClickSound();
              });
              elLangMenu.appendChild(item);
            })(LANG_LIST[i]);
          }
        }

        // Seçili dili tüm arayüze uygula
        function applyLang() {
          var info = getLangInfo(currentLang);
          document.documentElement.lang = info.htmlLang;
          document.documentElement.dir = info.dir;

          var flagSvg = FLAGS[currentLang] || FLAGS.tr;
          elLangBtn.innerHTML =
            flagSvg + "<span>" + currentLang.toUpperCase() + "</span>";
          elRestart.title = t("restart");
          disarmRestart();
          updateSoundButton();
          elCollBtnTxt.textContent = t("collBtn");
          elAboutBtnTxt.textContent = t("aboutBtn");
          elCollTitle.textContent = t("collTitle");
          elAboutTitle.textContent = t("aboutTitle");
          elCollClose.textContent = t("close");
          elAboutClose.textContent = t("close");
          elWinTitle.textContent = t("winTitle");
          elWinText.textContent = t("winText");

          buildLangMenu();
          updateCounter();
          if (elCollPanel.classList.contains("open")) buildCollection();
          if (elAboutPanel.classList.contains("open")) buildAbout();
        }

        function setLang(code) {
          if (!isValidLang(code)) return;
          currentLang = code;
          storageSet(STORAGE_LANG, code);
          applyLang();
        }

        // ----- Olay dinleyicileri -----
        function bindEvents() {
          // Canvas: touch + mouse uyumlu, mobilde scroll engelle
          canvas.addEventListener("pointerdown", function (e) {
            e.preventDefault();
            closeLangMenu();
            if (anyPanelOpen()) return;
            handlePrimaryAction(e.clientX, e.clientY);
          });

          // Klavye: Space / Enter = olta at veya yakala, Escape = paneller
          window.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
              closePanels();
              return;
            }
            if (e.code === "Space" || e.key === " " || e.key === "Enter") {
              e.preventDefault();
              if (e.repeat || anyPanelOpen()) return;
              handlePrimaryAction(null, null);
            }
          });

          // HUD butonları
          elRestart.addEventListener("click", onRestartClick);
          elSound.addEventListener("click", function () {
            toggleSound();
          });

          elLangBtn.addEventListener("click", function (e) {
            e.stopPropagation();
            var willOpen = !elLangMenu.classList.contains("open");
            closePanels();
            if (willOpen) {
              elLangMenu.classList.add("open");
              document.getElementById("hudRight").style.zIndex = "100";
            } else {
              elLangMenu.classList.remove("open");
              document.getElementById("hudRight").style.zIndex = "";
            }
            playClickSound();
          });

          elCollBtn.addEventListener("click", function () {
            openCollection();
            playClickSound();
          });
          elAboutBtn.addEventListener("click", function () {
            openAbout();
            playClickSound();
          });
          elCollClose.addEventListener("click", function () {
            closePanels();
            playClickSound();
          });
          elAboutClose.addEventListener("click", function () {
            closePanels();
            playClickSound();
          });

          // Menü dışına tıklayınca dil menüsünü kapat
          document.addEventListener("click", closeLangMenu);

          // Butonlardan odağı kaldır (Space tuşu butonu tekrar tetiklemesin)
          var buttons = document.querySelectorAll("button");
          for (var i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener("click", function () {
              this.blur();
            });
          }

          // Ekran boyutu değişince sadece resize() çağrılır
          var resizeTimer = 0;
          function scheduleResize() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
              if (window.innerWidth !== W || window.innerHeight !== H) resize();
            }, 120);
          }
          window.addEventListener("resize", scheduleResize);
          window.addEventListener("orientationchange", scheduleResize);

          // Sekme arka plana gidince sesi durdur
          document.addEventListener("visibilitychange", function () {
            if (!audioCtx) return;
            if (document.hidden) audioCtx.suspend();
            else audioCtx.resume();
          });
        }

        // ----- Ana animasyon döngüsü -----
        var STEP_MS = 1000 / 60,
          accMs = 0,
          lastMs = 0;

        function loop(now) {
          requestAnimationFrame(loop);
          nowMs = now || performance.now();
          var dtMs = lastMs ? nowMs - lastMs : STEP_MS;
          lastMs = nowMs;
          accMs += Math.min(dtMs, 100); // uzun duraklamada ani sıçrama olmasın

          // Oyun mantığı her ekran hızında saniyede 60 adım ilerler
          var steps = 0;
          while (accMs >= STEP_MS - 1 && steps < 5) {
            accMs -= STEP_MS;
            frameCount++;
            updateClouds();
            updateRays();
            updateGame();
            steps++;
          }
          if (steps === 5) accMs = 0;

          updateDayNight(nowMs);
          buildBackground();
          drawGame();
        }

        // =====================================================
        // BAŞLATMA SIRASI
        // =====================================================
        loadCollection(); // 1) koleksiyonu yükle
        resize(); // 2) canvas + cache'ler
        restoreSwimmers(); //    kayıtlı balıkları denize bırak
        var savedLang = storageGet(STORAGE_LANG);
        if (isValidLang(savedLang)) currentLang = savedLang;
        applyLang(); // 3) dili uygula
        bindEvents();
        startAudioOnFirstInteraction(); // ses ilk etkileşimde başlar
        loop(performance.now()); // 4) döngüyü başlat
      })();
    </script>
    <script>
      (function () {
        var el = document.createElement("div");
        el.style.cssText = "display:flex;flex-direction:column;gap:1px;position:absolute;visibility:hidden;";
        el.appendChild(document.createElement("div"));
        document.body.appendChild(el);
        var supported = el.scrollHeight === 2;
        document.body.removeChild(el);

      if (!supported) {
        document.documentElement.classList.add("no-flex-gap");
      }
      })();
    </script>
    <script>
      if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").then(function (reg) {
            reg.addEventListener("updatefound", function () {
              var nw = reg.installing;
              if (!nw) return;
              nw.addEventListener("statechange", function () {
                if (nw.state === "installed" && navigator.serviceWorker.controller) {
                  nw.postMessage("SKIP_WAITING");
                }
              });
            });
          }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
